name: Check certificate dependencies

on:
  pull_request:
    paths:
      - "src/cert-generator/**"
      - "src/s.yaml"
      - ".github/workflows/python-check.yml"
  push:
    branches: ["fix/certbot-openssl-compat"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build a clean FC dependency directory
        run: python -m pip install --no-cache-dir -r src/cert-generator/requirements.txt -t src/cert-generator/python
      - name: Check FC import and generate an offline CSR
        run: python src/cert-generator/check_dependencies.py
      - name: Check Certbot CLI
        env:
          PYTHONPATH: src/cert-generator/python
        run: python -c "from certbot.main import main; main(['--version'])"
